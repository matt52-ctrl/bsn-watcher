name: watcher BSN

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti: e' il minimo che GitHub consente
  workflow_dispatch:         # bottone "Run workflow" per provarlo a mano
    inputs:
      prova:
        description: "Manda solo un messaggio di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write            # serve per ricommittare stato.json

concurrency:
  group: watcher-bsn
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Controlla gli slot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bsn.py --once ${{ inputs.prova && '--prova' || '' }}

      - name: Salva lo stato se e' cambiato
        run: |
          if [ -n "$(git status --porcelain stato.json)" ]; then
            git config user.name "watcher-bsn"
            git config user.email "watcher-bsn@users.noreply.github.com"
            git add stato.json
            git commit -m "stato: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
